<!DOCTYPE html>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        #root { min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 25%, #312e81 50%, #1e40af 75%, #0f172a 100%); background-size: 400% 400%; animation: gradientShift 20s ease infinite; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #5a5a5a; }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-spin { animation: spin 1s linear infinite; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        .gradient-text { background: linear-gradient(135deg, #06b6d4, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-size: 200% 200%; animation: gradientShift 4s ease infinite; }
        .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // DSP & AUDIO HELPER FUNCTIONS
        function generateSweep(context, duration, startFreq, endFreq) { const sampleRate = context.sampleRate; const length = duration * sampleRate; const audioBuffer = context.createBuffer(1, length, sampleRate); const channelData = audioBuffer.getChannelData(0); const f0 = startFreq, f1 = endFreq, T = duration; const L = T / Math.log(f1 / f0); for (let i = 0; i < length; i++) { const t = i / sampleRate; const instFrequency = f0 * Math.exp(t / L); const phase = 2 * Math.PI * L * (instFrequency - f0); channelData[i] = Math.sin(phase) * 0.5; } return audioBuffer;}
        function calculateImpulseResponse(recordedSignal, originalSweep) { console.log("Simulating Impulse Response calculation..."); const sampleRate = originalSweep.sampleRate; const finalLength = sampleRate / 2; const impulseResponse = new Float32Array(finalLength).fill(0); const peakIndex = Math.floor(sampleRate * (0.001 + Math.random() * 0.05)); if (peakIndex < finalLength) { impulseResponse[peakIndex] = 1.0; for (let i = 1; i < 5; i++) { const echoIndex = peakIndex + Math.floor(sampleRate * (i * 0.05)); if (echoIndex < finalLength) impulseResponse[echoIndex] = 0.5 / i; } } return impulseResponse; }
        function findDelayInMs(impulseResponse, sampleRate) { if (!impulseResponse || impulseResponse.length === 0) return null; let peakValue = 0, peakIndex = -1; for (let i = 1; i < impulseResponse.length; i++) { const absValue = Math.abs(impulseResponse[i]); if (absValue > peakValue) { peakValue = absValue; peakIndex = i; } } if (peakIndex === -1) return null; return (peakIndex / sampleRate) * 1000; }
        function drawImpulseResponse(canvas, impulseResponse) { if (!canvas || !impulseResponse) return; const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#222'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = '#33ff33'; ctx.lineWidth = 1.5; let maxVal = 0; for(let i = 0; i < impulseResponse.length; i++) { const absVal = Math.abs(impulseResponse[i]); if (absVal > maxVal) maxVal = absVal; } if (maxVal === 0) return; const width = canvas.width, height = canvas.height, halfHeight = height / 2; ctx.beginPath(); for (let i = 0; i < impulseResponse.length; i++) { const x = (i / impulseResponse.length) * width; const y = halfHeight - (impulseResponse[i] / maxVal) * halfHeight; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); } ctx.stroke();}

        // Icon Components
        const MicIcon = ({ size = 24, className = "" }) => ( <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}> <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /> <path d="M19 10v2a7 7 0 0 1-14 0v-2" /> <line x1="12" x2="12" y1="19" y2="22" /> </svg> );
        const CameraIcon = ({ size = 24, className = "" }) => ( <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}> <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /> <circle cx="12" cy="13" r="3" /> </svg> );
        const BrainIcon = ({ size = 24, className = "" }) => ( <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}> <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" /> <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" /> </svg> );
        const PlayIcon = ({ size = 20, className = "" }) => ( <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}> <polygon points="6 3 20 12 6 21 6 3" /> </svg> );
        const StopIcon = ({ size = 20, className = "" }) => ( <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}> <rect x="5" y="5" width="14" height="14" rx="2" /> </svg> );
        const KeyIcon = ({ size = 20, className = "" }) => ( <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}> <path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4" /> <path d="m21 2-9.6 9.6" /> <circle cx="7.5" cy="15.5" r="5.5" /> </svg> );
        const GithubIcon = ({ size = 20, className = "" }) => ( <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}> <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" /> </svg> );
        const LoadingSpinner = ({ size = 20, className = "" }) => ( <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`animate-spin ${className}`}> <path d="M21 12A9 9 0 1 1 12 3" /> </svg> );
        const ChartIcon = ({ size = 24, className = "" }) => ( <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}> <path d="M3 3v18h18" /> <path d="m18 9-5 5-4-4-3 3" /> </svg> );
        
        // UI Components
        const DemoBanner = () => { const [isVisible, setIsVisible] = useState(true); const [timeLeft, setTimeLeft] = useState(''); useEffect(() => { const timer = setTimeout(() => setIsVisible(false), 10000); return () => clearTimeout(timer); }, []); useEffect(() => { const updateTime = () => { const now = new Date(); const hours = now.getHours().toString().padStart(2, '0'); const minutes = now.getMinutes().toString().padStart(2, '0'); setTimeLeft(`${hours}:${minutes}`); }; updateTime(); const interval = setInterval(updateTime, 1000); return () => clearInterval(interval); }, []); if (!isVisible) return null; return <div className="demo-banner text-center py-3 text-white font-bold text-sm relative overflow-hidden cursor-pointer" onClick={() => setIsVisible(false)}> <div className="relative z-10 flex items-center justify-center space-x-4"> <span className="animate-bounce">🎙️</span> <span>ONLINE DEMO</span> <span className="hidden sm:inline">•</span> <span className="hidden sm:inline">Try Acoustic Space Analyzer AI Pro</span> <span className="text-yellow-300">•</span> <span className="font-mono text-xs">{timeLeft}</span> <button className="ml-4 hover:bg-white/20 rounded p-1 transition-colors" onClick={(e) => { e.stopPropagation(); setIsVisible(false); }}>✕</button> </div> </div>; };
        const AudioRecorder = ({ isRecording, microphoneStatus, onInitialize, onStartRecording }) => { const getStatusConfig = () => ({ 'not-initialized': { color: 'bg-gray-700 text-gray-300', icon: '⚪', text: 'System not initialized' }, 'requesting': { color: 'bg-yellow-900/30 text-yellow-400', icon: '⏳', text: 'Requesting permissions...' }, 'denied': { color: 'bg-red-900/30 text-red-400', icon: '❌', text: 'Permissions denied' }, 'granted': { color: 'bg-green-900/30 text-green-400', icon: '✅', text: 'Microphone active' } }[microphoneStatus] || { color: 'bg-gray-700 text-gray-300', icon: '⚪', text: 'System not initialized' }); const statusConfig = getStatusConfig(); const buttonText = isRecording ? `Measuring...` : `Measure Impulse Response`; return <div className="bg-gray-800/50 backdrop-blur rounded-xl p-6 border border-gray-700 animate-fade-in"> <h3 className="text-xl font-semibold mb-4 flex items-center"><MicIcon className="mr-2 text-cyan-400" /> Audio Measurement</h3> <div className="mb-4"><div className={`text-center py-2 px-3 rounded-lg transition-all ${statusConfig.color}`}>{`${statusConfig.icon} ${statusConfig.text}`}</div></div> <button onClick={microphoneStatus !== 'granted' ? onInitialize : onStartRecording} disabled={microphoneStatus === 'requesting' || isRecording} className={`w-full py-3 px-4 rounded-lg font-medium transition-all ${ microphoneStatus !== 'granted' ? 'bg-blue-600 hover:bg-blue-700' : isRecording ? 'bg-gray-600 cursor-not-allowed' : 'bg-cyan-600 hover:bg-cyan-700 hover-lift' } ${microphoneStatus === 'requesting' ? 'cursor-not-allowed opacity-50' : ''}`}> <div className="flex items-center justify-center"> {microphoneStatus !== 'granted' ? <><MicIcon className="mr-2" />Initialize Microphone</> : isRecording ? <><LoadingSpinner className="mr-2" />Measuring...</> : <><PlayIcon className="mr-2" />{buttonText}</>} </div> </button> </div>; };
        const FileUploader = ({ isScanning, spatialData, onLoadDemo }) => { return <div className="bg-gray-800/50 backdrop-blur rounded-xl p-6 border border-gray-700 animate-fade-in"> <h3 className="text-xl font-semibold mb-4 flex items-center"><CameraIcon className="mr-2 text-purple-400" />3D Scan</h3> <button onClick={onLoadDemo} disabled={isScanning} className={`w-full py-3 px-4 rounded-lg font-medium transition-all mb-3 ${isScanning ? 'bg-purple-600 cursor-not-allowed' : 'bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 hover-lift'}`}> <div className="flex items-center justify-center"> {isScanning ? <><LoadingSpinner className="mr-2" />Loading Demo...</> : <><CameraIcon className="mr-2" />🎬 Load Garage DEMO</>} </div> </button> {spatialData && <div className="mt-3 text-sm text-green-400 animate-fade-in">✓ {spatialData.roomDimensions.width.toFixed(1)}×{spatialData.roomDimensions.height.toFixed(1)}×{spatialData.roomDimensions.depth.toFixed(1)}m<div className="text-xs text-gray-400">{spatialData.isDemo ? '🎬 DEMO' : 'Custom file'}</div></div>} </div>; };
        const AIAnalyzer = ({ isAnalyzing, analysisResult, spatialData, apiConfig, onAnalyze }) => { const canAnalyze = analysisResult && spatialData && apiConfig.apiKey; return <div className="bg-gray-800/50 backdrop-blur rounded-xl p-6 border border-gray-700 animate-fade-in"> <h3 className="text-xl font-semibold mb-4 flex items-center"><BrainIcon className="mr-2 text-pink-400" />AI Analysis</h3> <button onClick={onAnalyze} disabled={isAnalyzing || !canAnalyze} className={`w-full py-3 px-4 rounded-lg font-medium transition-all ${isAnalyzing || !canAnalyze ? 'bg-gray-600 cursor-not-allowed' : 'bg-pink-600 hover:bg-pink-700 hover-lift'}`}> <div className="flex items-center justify-center">{isAnalyzing ? <><LoadingSpinner className="mr-2" />Analyzing...</> : <><BrainIcon className="mr-2" />Generate DSP Chain</>}</div> </button> {!apiConfig.apiKey && <p className="text-xs text-red-400 mt-2 text-center">⚠️ Configure API key first</p>} {(!analysisResult || !spatialData) && <p className="text-xs text-yellow-400 mt-2 text-center">📝 Perform measurement and load 3D scan first</p>} </div>; };
        const ImpulseResponseAnalysis = ({ analysisResult }) => { const canvasRef = useRef(null); useEffect(() => { if (analysisResult && analysisResult.impulseResponse) { drawImpulseResponse(canvasRef.current, analysisResult.impulseResponse); } }, [analysisResult]); if (!analysisResult) return null; return <div className="bg-gray-800/50 backdrop-blur rounded-xl p-6 mb-8 border border-gray-700 animate-fade-in"> <h3 className="text-xl font-semibold mb-4 flex items-center"><ChartIcon className="mr-2 text-green-400" />Impulse Response Analysis</h3> <canvas ref={canvasRef} width="500" height="150" className="w-full bg-black/20 rounded-lg" /> <div className="mt-4 text-center bg-gray-700/50 p-3 rounded-lg"> <span className="text-gray-300">Calculated Delay: </span> <span className="text-2xl font-bold text-green-300 ml-2">{`${analysisResult.delay ? analysisResult.delay.toFixed(2) : '...
